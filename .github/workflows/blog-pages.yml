name: Deploy blog to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "workloads/blog/src/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  ZOLA_VERSION: "0.23.6"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Zola
        run: |
          curl -sSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin zola
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Zola
        working-directory: workloads/blog/src
        run: SITE_COMMIT_SHA=$(git rev-parse --short HEAD) zola build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "workloads/blog/src/public"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
