name: Renew interaction limits

# Job body lives in noisypigeon/pigeon.dev (ADR-0155) -- this file keeps only
# the trigger, permissions and concurrency. A cron trigger can't live in
# another repo.
on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  renew:
    uses: noisypigeon/pigeon.dev/.github/workflows/interaction-limits-renew.yml@main
    secrets: inherit
