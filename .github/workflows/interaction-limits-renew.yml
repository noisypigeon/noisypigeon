name: Renew interaction limits

# Job body lives in noisypigeon/pigeon-lib (ADR-0155, moved there by LIB-0002)
# -- this file keeps only the trigger, permissions and concurrency. A cron
# trigger can't live in another repo.
#
# Pinned to a version rather than @main: LIB-0001 invariant 2. DEV-0155 deferred
# this track deliberately, accepting live @main as cheaper than paying for it
# upfront; with three spokes consuming the hub, LIB-0002 built it.
on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  renew:
    uses: noisypigeon/pigeon-lib/.github/workflows/interaction-limits-renew.yml@workflows/v1.0.2
    secrets: inherit
