name: module-docs

on:
  push:
    branches: [main]
    paths:
      - '**/*.tf'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: main-writer
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate module docs
        uses: terraform-docs/gh-actions@v1.4.1
        with:
          working-dir: terraform/modules/scaleway/project,terraform/modules/scaleway/object-bucket,terraform/modules/scaleway/iam-policy,terraform/modules/scaleway/compute-instance,terraform/modules/scaleway/block-volume
          output-file: README.md
          output-method: inject
          output-format: markdown table
          args: --show inputs --show outputs
          git-push: "true"
          git-commit-message: "docs: regenerate module input/output tables"
