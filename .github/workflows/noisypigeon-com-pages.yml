# Deploys noisypigeon.com/src to GitHub Pages. Cross-repo call into
# noisypigeon/pigeon.dev's zola-site-pages.yml -- deploy-pages always
# targets the calling repo's own Pages site, and this repo owns the
# noisypigeon.com content, so this caller has to live here (ADR-0158).
#
# Passes fetch_templates_script since this repo, unlike pigeon.dev, doesn't
# vendor templates/ at its root -- same noisypigeon.com/fetch-templates.sh
# mechanism zola-sites-deploy.yml's bucket job already used.
name: Deploy noisypigeon.com (Pages)

on:
  push:
    branches: ["main"]
    paths:
      - "noisypigeon.com/src/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: noisypigeon-com-pages
  cancel-in-progress: false

jobs:
  deploy:
    uses: noisypigeon/pigeon.dev/.github/workflows/zola-site-pages.yml@main
    with:
      src_dir: noisypigeon.com/src
      build_cmd: "SITE_COMMIT_SHA=$(git rev-parse --short HEAD) zola build"
      fetch_templates_script: noisypigeon.com/fetch-templates.sh
