name: Deploy pigeon.dev wiki

on:
  push:
    branches: ["main"]
    paths:
      - "workloads/pigeon.dev/src/**"
      - "templates/zola-site/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pigeon-dev-pages"
  cancel-in-progress: false

env:
  ZOLA_VERSION: "0.23.6"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Resolve zola-site theme
        working-directory: workloads/pigeon.dev/src
        run: ../../../templates/zola-site/resolve-theme.sh
      - name: Generate module redirect pages
        run: workloads/pigeon.dev/generate-module-redirects.sh
      - name: Install Zola
        run: |
          curl -sSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin zola
      - name: Build with Zola
        working-directory: workloads/pigeon.dev/src
        run: zola build
      - name: Sync to Scaleway Object Storage
        working-directory: workloads/pigeon.dev/src
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PIGEON_DEV_SCW_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PIGEON_DEV_SCW_SECRET_KEY }}
          AWS_DEFAULT_REGION: fr-par
        run: |
          aws s3 sync public s3://pigeon.dev \
            --endpoint-url https://s3.fr-par.scw.cloud \
            --acl public-read \
            --delete
