name: Terragrunt apply

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: terragrunt-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >
      github.event.issue.pull_request != null &&
      github.event.comment.body == 'terragrunt apply' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: React to triggering comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
            });

      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0

      - name: Ensure a local main ref exists
        run: git fetch origin main:refs/heads/main

      - uses: jdx/mise-action@v2

      - name: Mask decrypted secret values
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          while IFS='=' read -r key value; do
            [[ -z "$key" || "$key" == \#* || "$key" == sops_* ]] && continue
            echo "::add-mask::$value"
          done < <(sops --decrypt --input-type dotenv --output-type dotenv .env.enc)

      - name: Clear terragrunt cache
        run: find workloads -type d -name ".terragrunt-cache" -exec rm -rf {} +

      - name: terragrunt apply
        id: run
        working-directory: workloads
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set +e
          terragrunt --no-color run --all --filter-affected --filter-allow-destroy --non-interactive -- apply > output.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Comment apply output on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terragrunt-apply -->';
            const exitCode = '${{ steps.run.outputs.exit_code }}';
            const success = exitCode === '0';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let output;
            try {
              output = fs.readFileSync('workloads/output.txt', 'utf8');
            } catch {
              output = null;
            }

            let body;
            if (output === null) {
              body = [
                marker,
                '### ❌ Terragrunt apply',
                `_Job failed before \`terragrunt apply\` ran — see the [full log](${runUrl})._`,
              ].join('\n');
            } else {
              const limit = 55000;
              let truncated = false;
              if (output.length > limit) {
                output = output.slice(output.length - limit);
                truncated = true;
              }
              body = [
                marker,
                `### ${success ? '✅' : '❌'} Terragrunt apply`,
                truncated ? `_Output truncated — [full log](${runUrl})._` : '',
                '<details><summary>Show apply output</summary>',
                '',
                '```',
                output,
                '```',
                '</details>',
              ].join('\n');
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: success ? '+1' : '-1',
            });

      - name: Fail if apply failed
        run: exit "${{ steps.run.outputs.exit_code }}"
