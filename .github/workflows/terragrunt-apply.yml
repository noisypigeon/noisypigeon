name: Terragrunt apply

# Job body lives in noisypigeon/pigeon.dev (ADR-0155) -- this file keeps
# only the trigger, permissions, concurrency, and the authorization gate
# below. That gate -- a fixed comment body plus an OWNER/MEMBER/COLLABORATOR
# author-association check -- is what stands between an arbitrary PR comment
# and applying real infrastructure, so it stays reviewable in this repo
# rather than moving to a repo whose stated purpose is publishing templates.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: terragrunt-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >
      github.event.issue.pull_request != null &&
      github.event.comment.body == 'terragrunt apply' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    uses: noisypigeon/pigeon.dev/.github/workflows/terragrunt-run.yml@main
    with:
      command: apply
      checkout_ref: refs/pull/${{ github.event.issue.number }}/head
    secrets: inherit
