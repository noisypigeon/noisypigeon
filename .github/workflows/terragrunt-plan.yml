name: Terragrunt plan

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: terragrunt-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  # Always runs, regardless of what changed, so the terragrunt/apply merge-gate
  # status (required by the repo ruleset, see docs/adr/0129) resolves to
  # success immediately for PRs that touch no terraform leaf, rather than
  # staying unreported and blocking the merge forever.
  detect:
    runs-on: ubuntu-latest
    outputs:
      affects-leaves: ${{ steps.check.outputs.affects-leaves }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether any terraform leaf is affected
        id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          if echo "$CHANGED_FILES" | grep -qE '^workloads/[^/]+/terraform/|^\.env\.enc$|^\.sops\.yaml$'; then
            echo "affects-leaves=true" >> "$GITHUB_OUTPUT"
          else
            echo "affects-leaves=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set merge-gate status
        uses: actions/github-script@v7
        with:
          script: |
            const affectsLeaves = '${{ steps.check.outputs.affects-leaves }}' === 'true';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ github.event.pull_request.head.sha }}',
              state: affectsLeaves ? 'pending' : 'success',
              context: 'terragrunt/apply',
              description: affectsLeaves
                ? 'Awaiting successful terragrunt apply'
                : 'No terraform leaves affected',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  plan:
    needs: detect
    if: needs.detect.outputs.affects-leaves == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure a local main ref exists
        run: git fetch origin main:refs/heads/main

      - uses: jdx/mise-action@v2

      - name: Mask decrypted secret values
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          while IFS='=' read -r key value; do
            [[ -z "$key" || "$key" == \#* || "$key" == sops_* ]] && continue
            echo "::add-mask::$value"
          done < <(sops --decrypt --input-type dotenv --output-type dotenv .env.enc)

      - name: Clear terragrunt cache
        run: find workloads -type d -name ".terragrunt-cache" -exec rm -rf {} +

      - name: terragrunt plan
        id: run
        working-directory: workloads
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set +e

          # terragrunt's own --filter-affected only tracks changes to a unit's
          # terragrunt.hcl / HCL-level reads, not files a .tf module reads via
          # Terraform's native file()/fileset() (e.g. a dashboard JSON asset) --
          # a documented upstream gap (gruntwork-io/terragrunt#6952, not planned
          # to be fixed pre-1.2; see docs/adr/0138). Union it with an explicit
          # --filter per leaf directory containing any changed file, computed by
          # walking up to the nearest terragrunt.hcl -- multiple --filter flags
          # combine with OR logic.
          FILTER_ARGS=(--filter '[main...HEAD]')
          dirs=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            rel="${f#workloads/}"
            [ "$rel" = "$f" ] && continue
            dir=$(dirname "$rel")
            while [ "$dir" != "." ] && [ ! -f "$dir/terragrunt.hcl" ]; do
              dir=$(dirname "$dir")
            done
            [ -f "$dir/terragrunt.hcl" ] || continue
            case " $dirs " in
              *" $dir "*) continue ;;
            esac
            dirs="$dirs $dir"
            FILTER_ARGS+=(--filter "./$dir")
          done < <(git -C .. diff --name-only main...HEAD)

          terragrunt --no-color run --all "${FILTER_ARGS[@]}" --filter-allow-destroy --non-interactive -- plan > output.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Comment plan output on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terragrunt-plan -->';
            const exitCode = '${{ steps.run.outputs.exit_code }}';
            const success = exitCode === '0';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let output;
            try {
              output = fs.readFileSync('workloads/output.txt', 'utf8');
            } catch {
              output = null;
            }

            let body;
            if (output === null) {
              body = [
                marker,
                '### ❌ Terragrunt plan',
                `_Job failed before \`terragrunt plan\` ran — see the [full log](${runUrl})._`,
              ].join('\n');
            } else {
              const limit = 55000;
              let truncated = false;
              if (output.length > limit) {
                output = output.slice(output.length - limit);
                truncated = true;
              }
              body = [
                marker,
                `### ${success ? '✅' : '❌'} Terragrunt plan`,
                truncated ? `_Output truncated — [full log](${runUrl})._` : '',
                '<details><summary>Show plan output</summary>',
                '',
                '```',
                output,
                '```',
                '</details>',
                '',
                success ? 'Comment `terragrunt apply` on this PR to apply these changes.' : '',
              ].join('\n');
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const minimize = `mutation($id: ID!) { minimizeComment(input: { subjectId: $id, classifier: OUTDATED }) { clientMutationId } }`;
            for (const c of comments.filter(c => c.body.includes(marker))) {
              await github.graphql(minimize, { id: c.node_id });
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail if plan failed
        run: exit "${{ steps.run.outputs.exit_code }}"
