name: Terragrunt plan

# Job bodies live in noisypigeon/pigeon-lib (ADR-0155, moved by LIB-0002) -- this file keeps
# only the trigger, permissions and concurrency. terragrunt/apply is this
# repo's one required status check (docs/adr/0129); it's a commit status
# with an explicit `context` string, so the detect/plan job rename to
# "plan / detect" and "plan / run" in the checks UI is cosmetic.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: terragrunt-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  detect:
    uses: noisypigeon/pigeon-lib/.github/workflows/terragrunt-detect.yml@workflows/v1.0.2

  plan:
    needs: detect
    if: needs.detect.outputs.affects-leaves == 'true'
    uses: noisypigeon/pigeon-lib/.github/workflows/terragrunt-run.yml@workflows/v1.0.2
    with:
      command: plan
    secrets: inherit
