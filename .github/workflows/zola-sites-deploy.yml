name: Deploy Zola sites

on:
  push:
    branches: ["main"]
    paths:
      - "workloads/pigeon.dev/src/**"
  workflow_dispatch:
    inputs:
      site:
        description: "Which site to deploy. noisypigeon.com now deploys via noisypigeon-com-pages.yml instead -- kept as a (no-op) choice so existing cross-repo dispatches (template-release.yml, blog-changelog.yml) that still pass it don't fail input validation (ADR-0158)."
        type: choice
        options: ["all", "noisypigeon.com", "pigeon.dev"]
        default: "all"

permissions:
  contents: read

jobs:
  # Tells deploy-pigeon-dev whether it actually needs redeploying. Mirrors
  # the `detect` job pattern in terragrunt-detect.yml (docs/adr/0129).
  # noisypigeon.com no longer has a job here to detect for (ADR-0158); its
  # "noisypigeon.com"/"all" dispatch values are accepted but resolve to
  # nothing now.
  detect:
    runs-on: ubuntu-latest
    outputs:
      pigeondev: ${{ steps.check.outputs.pigeondev }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check which sites changed
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SITE_INPUT="${{ github.event.inputs.site }}"
            PIGEONDEV=false
            case "$SITE_INPUT" in
              pigeon.dev) PIGEONDEV=true ;;
              all) PIGEONDEV=true ;;
              *) PIGEONDEV=false ;;
            esac
          else
            CHANGED_FILES=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
            PIGEONDEV=false
            echo "$CHANGED_FILES" | grep -q '^workloads/pigeon.dev/src/' && PIGEONDEV=true
          fi

          echo "pigeondev=$PIGEONDEV" >> "$GITHUB_OUTPUT"

  deploy-pigeon-dev:
    needs: detect
    if: needs.detect.outputs.pigeondev == 'true'
    concurrency:
      group: "zola-deploy-pigeon.dev"
      cancel-in-progress: false
    uses: noisypigeon/pigeon.dev/.github/workflows/zola-site-deploy.yml@main
    with:
      src_dir: workloads/pigeon.dev/src
      bucket: pigeon.dev
      build_cmd: "zola build"
      extra_step: "workloads/pigeon.dev/generate-module-redirects.sh"
    secrets:
      scw_access_key: ${{ secrets.PIGEON_DEV_SCW_ACCESS_KEY }}
      scw_secret_key: ${{ secrets.PIGEON_DEV_SCW_SECRET_KEY }}
