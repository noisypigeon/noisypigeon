name: Deploy Zola sites

on:
  push:
    branches: ["main"]
    paths:
      - "workloads/noisypigeon.com/src/**"
  workflow_dispatch:
    inputs:
      site:
        description: "Which site to deploy"
        type: choice
        options: ["all", "noisypigeon.com"]
        default: "all"

permissions:
  contents: read

jobs:
  # noisypigeon.com is this workflow's only site since ADR-0156 moved
  # pigeon.dev/src into noisypigeon/pigeon.dev, where it deploys via GitHub
  # Pages instead (pigeon-dev-pages.yml, in that repo). `detect` and the
  # `site` input both stay even with one site: `-f site=all` and
  # `-f site=noisypigeon.com` are live dispatch targets from this repo's own
  # blog-changelog.yml and from pigeon.dev's template-release.yml, and
  # narrowing the input's accepted values is its own cross-repo coordination
  # risk independent of this change.
  detect:
    runs-on: ubuntu-latest
    outputs:
      noisypigeon: ${{ steps.check.outputs.noisypigeon }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check which sites changed
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NOISYPIGEON=true
          else
            CHANGED_FILES=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
            NOISYPIGEON=false
            echo "$CHANGED_FILES" | grep -q '^workloads/noisypigeon.com/src/' && NOISYPIGEON=true
          fi

          echo "noisypigeon=$NOISYPIGEON" >> "$GITHUB_OUTPUT"

  # Job body lives in noisypigeon/pigeon.dev (ADR-0155). Which sites exist,
  # and which secrets belong to which, stays here: that dynamic
  # secrets[matrix.*] lookup is exactly what can't be expressed inside a
  # called workflow's statically-declared `secrets:` block.
  deploy-noisypigeon-com:
    needs: detect
    if: needs.detect.outputs.noisypigeon == 'true'
    concurrency:
      group: "zola-deploy-noisypigeon.com"
      cancel-in-progress: false
    uses: noisypigeon/pigeon.dev/.github/workflows/zola-site-deploy.yml@main
    with:
      src_dir: workloads/noisypigeon.com/src
      bucket: noisypigeon.com
      build_cmd: "SITE_COMMIT_SHA=$(git rev-parse --short HEAD) zola build"
    secrets:
      scw_access_key: ${{ secrets.NOISYPIGEON_COM_SCW_ACCESS_KEY }}
      scw_secret_key: ${{ secrets.NOISYPIGEON_COM_SCW_SECRET_KEY }}
