name: Deploy Zola sites

on:
  push:
    branches: ["main"]
    paths:
      - "workloads/noisypigeon.com/src/**"
      - "workloads/pigeon.dev/src/**"
  workflow_dispatch:
    inputs:
      site:
        description: "Which site to deploy"
        type: choice
        options: ["all", "noisypigeon.com", "pigeon.dev"]
        default: "all"

permissions:
  contents: read

jobs:
  # Tells the two deploy jobs below which site(s) actually need redeploying,
  # so a pigeon.dev-only push doesn't also redeploy noisypigeon.com and vice
  # versa. Mirrors the `detect` job pattern in terragrunt-detect.yml
  # (docs/adr/0129). A workflow_dispatch with an explicit `site` input
  # (used by blog-changelog's and template-release's automated post-merge
  # dispatches) targets just that site; the default "all" (a genuinely
  # manual dispatch) redeploys both. Since ADR-0154 a theme change no longer
  # arrives as a push path here -- it arrives as pigeon.dev's own
  # template-release.yml dispatching this workflow with site=all.
  detect:
    runs-on: ubuntu-latest
    outputs:
      noisypigeon: ${{ steps.check.outputs.noisypigeon }}
      pigeondev: ${{ steps.check.outputs.pigeondev }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check which sites changed
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SITE_INPUT="${{ github.event.inputs.site }}"
            NOISYPIGEON=false
            PIGEONDEV=false
            case "$SITE_INPUT" in
              noisypigeon.com) NOISYPIGEON=true ;;
              pigeon.dev) PIGEONDEV=true ;;
              *) NOISYPIGEON=true; PIGEONDEV=true ;;
            esac
          else
            CHANGED_FILES=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
            NOISYPIGEON=false
            echo "$CHANGED_FILES" | grep -q '^workloads/noisypigeon.com/src/' && NOISYPIGEON=true
            PIGEONDEV=false
            echo "$CHANGED_FILES" | grep -q '^workloads/pigeon.dev/src/' && PIGEONDEV=true
          fi

          echo "noisypigeon=$NOISYPIGEON" >> "$GITHUB_OUTPUT"
          echo "pigeondev=$PIGEONDEV" >> "$GITHUB_OUTPUT"

  # Job body lives in noisypigeon/pigeon.dev (ADR-0155), deployed one site at
  # a time -- a job that `uses:` a reusable workflow can't also run its own
  # steps, so the per-site skip has to be a job-level `if:` rather than the
  # single step the old matrixed job used; two explicit jobs (instead of one
  # matrixed job indexing needs.detect.outputs by a matrix-provided key)
  # avoids depending on dynamic object-key evaluation inside a job `if:`.
  # Which sites exist, and which secrets belong to which, stays here: that
  # dynamic secrets[matrix.*] lookup is exactly what can't be expressed
  # inside a called workflow's statically-declared `secrets:` block.
  deploy-noisypigeon-com:
    needs: detect
    if: needs.detect.outputs.noisypigeon == 'true'
    concurrency:
      group: "zola-deploy-noisypigeon.com"
      cancel-in-progress: false
    uses: noisypigeon/pigeon.dev/.github/workflows/zola-site-deploy.yml@main
    with:
      src_dir: workloads/noisypigeon.com/src
      bucket: noisypigeon.com
      build_cmd: "SITE_COMMIT_SHA=$(git rev-parse --short HEAD) zola build"
    secrets:
      scw_access_key: ${{ secrets.NOISYPIGEON_COM_SCW_ACCESS_KEY }}
      scw_secret_key: ${{ secrets.NOISYPIGEON_COM_SCW_SECRET_KEY }}

  deploy-pigeon-dev:
    needs: detect
    if: needs.detect.outputs.pigeondev == 'true'
    concurrency:
      group: "zola-deploy-pigeon.dev"
      cancel-in-progress: false
    uses: noisypigeon/pigeon.dev/.github/workflows/zola-site-deploy.yml@main
    with:
      src_dir: workloads/pigeon.dev/src
      bucket: pigeon.dev
      build_cmd: "zola build"
      extra_step: "workloads/pigeon.dev/generate-module-redirects.sh"
    secrets:
      scw_access_key: ${{ secrets.PIGEON_DEV_SCW_ACCESS_KEY }}
      scw_secret_key: ${{ secrets.PIGEON_DEV_SCW_SECRET_KEY }}
