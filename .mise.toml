[tools]
terraform = "1.16.3"
terragrunt = "1.1.6"
zola = "0.23.6"
sops = "3.13.3"

# ADRs live in noisypigeon/pigeon.dev under adr/infrastructure/ since
# ADR-0157. These tasks operate on a local clone of that repo at .adr-src
# (gitignored); set ADR_SRC to point at your own checkout instead.
[tasks.adr-fetch]
run = ".github/scripts/fetch-adrs.sh"

[tasks.adr-new]
run = ".github/scripts/adr-new.sh \"$@\""

[tasks.adr-issue]
run = ".github/scripts/adr-issue.sh \"$@\""

[tasks.secrets-edit]
run = "sops --input-type dotenv --output-type dotenv .env.enc"

[env]
# terragrunt defaults to invoking `tofu`; this repo standardizes on Terraform.
TG_TF_PATH = "terraform"

[tasks.fmt-terraform]
run = ["terragrunt hcl format", "terraform fmt -recursive"]

[tasks.fmt-check-terraform]
run = ["terragrunt hcl format --check", "terraform fmt -recursive -check"]

[tasks.plan]
run = "terragrunt run --all -- plan"

[tasks.apply]
run = "terragrunt run --all -- apply"

# noisypigeon.com/src moved to noisypigeon/noisypigeon.com repo (ADR-0159).
# Build tasks for the blog now live in that repo.
