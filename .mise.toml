[tools]
terraform = "1.16.3"
terragrunt = "1.1.6"
zola = "0.23.6"
sops = "3.13.3"

# ADRs live in noisypigeon/pigeon.dev under adr/infrastructure/ since
# ADR-0157. These tasks operate on a local clone of that repo at .adr-src
# (gitignored); set ADR_SRC to point at your own checkout instead.
[tasks.adr-fetch]
run = ".github/scripts/fetch-adrs.sh"

[tasks.adr-new]
run = ".github/scripts/adr-new.sh \"$@\""

[tasks.adr-issue]
run = ".github/scripts/adr-issue.sh \"$@\""

[tasks.secrets-edit]
run = "sops --input-type dotenv --output-type dotenv .env.enc"

[env]
# terragrunt defaults to invoking `tofu`; this repo standardizes on Terraform.
TG_TF_PATH = "terraform"

[tasks.fmt-terraform]
run = ["terragrunt hcl format", "terraform fmt -recursive"]

[tasks.fmt-check-terraform]
run = ["terragrunt hcl format --check", "terraform fmt -recursive -check"]

[tasks.plan]
run = "terragrunt run --all -- plan"

[tasks.apply]
run = "terragrunt run --all -- apply"

# templates/ lives in noisypigeon/pigeon.dev since ADR-0154, so the blog
# build fetches that clone first and resolves the theme out of it. Set
# TEMPLATES_SRC to your own checkout of that repo to build against local
# template changes instead. pigeon.dev/src itself moved into that same repo
# by ADR-0156, so it no longer needs this fetch step at all -- its own build
# tasks now live there.
[tasks.blog-build]
dir = "noisypigeon.com/src"
run = [
  "../fetch-templates.sh",
  '"${TEMPLATES_SRC:-$(git rev-parse --show-toplevel)/.templates-src}/templates/zola-site/resolve-theme.sh"',
  "SITE_COMMIT_SHA=$(git rev-parse --short HEAD) zola build",
]

[tasks.blog-serve]
dir = "noisypigeon.com/src"
run = [
  "../fetch-templates.sh",
  '"${TEMPLATES_SRC:-$(git rev-parse --show-toplevel)/.templates-src}/templates/zola-site/resolve-theme.sh"',
  "SITE_COMMIT_SHA=$(git rev-parse --short HEAD) zola serve",
]
