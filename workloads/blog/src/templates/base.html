<!DOCTYPE html>
<html lang="en-US" dir="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">

  <link rel="icon" href="{{ config.extra.avatar }}" type="image/png">
  <link rel="apple-touch-icon" href="{{ config.extra.avatar }}">

  <meta property="og:site_name" content="{{ config.title }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{% block og_url %}{{ config.base_url }}/{% endblock og_url %}">
  <meta property="og:title" content="{% block og_title %}{{ config.title }}{% endblock og_title %}">
  <meta property="og:description" content="{% block og_description %}{{ config.description }}{% endblock og_description %}">
  <meta property="og:image" content="{{ config.base_url }}{{ config.extra.social_preview }}">

  <link rel="alternate" type="application/atom+xml" title="{{ config.title }}" href="/posts/posts_feed.xml" />

  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css" crossorigin="anonymous">

  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin>
  <link rel="stylesheet" href="https://fonts.bunny.net/css?family=ibm-plex-sans:400,400i,500,500i,600,600i,700,700i&display=swap">

  <meta name="theme-color" media="(prefers-color-scheme: light)" content="rgb(228, 233, 226)">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="rgb(25, 28, 26)">
</head>
<body class="site-view {% block body_class %}{% endblock body_class %} color-theme-gameboy font-theme-ibm-plex">
  <a class="skip-link" href="#main">Skip to content</a>

  {% include "header.html" %}

  <main id="main" class="site-main">
    {% block content %}{% endblock content %}
  </main>

  <footer class="footer">
    WG {{ now() | date(format="%Y") }} * {{ get_env(name="SITE_COMMIT_SHA", default="dev") }} * <a href="/changelog">Changelog</a>
  </footer>

  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js" crossorigin="anonymous"
    onload="renderMathInElement(document.body, {delimiters: [
      {left: '\\[', right: '\\]', display: true},
      {left: '\\(', right: '\\)', display: false}
    ]});"></script>
</body>
</html>
